<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Taste — Next 5 Days</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="theme-ahead">
    <div id="content-wrapper">
        <div id="location">
            <span class="card-label">Location</span>
            <p class="is-loading">Locating</p>
        </div>
        <div class="nav-button third">
            <a href="javascript:void(0);" id="back-button" class="forecast-button">← Back to now</a>
        </div>
        <div class="nav-button third">
            <a href="intel.html" class="back-button">← Change city</a>
        </div>

        <div id="forecast-grid"></div>
        <div id="status"></div>
    </div>

    <script>
        // Weather and recommendations go through this site's own /api routes.
        // The WeatherAPI and Groq keys are Cloudflare secrets held on the
        // server and are never sent to the browser.

        async function getWeather() {
            const params = new URLSearchParams(window.location.search);
            const locationKey = params.get('city');
            const city_text = params.get('city_text');

            if (!locationKey || !city_text) {
                displayError('Missing location key or city name.');
                return;
            }

            try {
                const weather = await fetchWeatherData(locationKey);

                displayLocation(weather, city_text);
                document.getElementById('back-button').href = `n_t.html?city=${encodeURIComponent(locationKey)}&city_text=${encodeURIComponent(city_text)}`;

                // Lay every day out first so the grid doesn't reflow as each
                // day's picks arrive, then fill the picks in one day at a time.
                const grid = document.getElementById('forecast-grid');
                grid.innerHTML = weather.days.map(function (d, i) {
                    return `
                        <div class="weather-day" id="day-${i}">
                            <p class="weather-day-date">${escapeHtml(formatDate(d.date))}</p>
                            <p class="weather-day-description">${escapeHtml(d.weatherText)}</p>
                            <p class="weather-day-temps">${escapeHtml(d.minC)}°C — <span class="max">${escapeHtml(d.maxC)}°C</span></p>
                            <div class="day-pick"><p class="is-loading">Picking music</p></div>
                        </div>`;
                }).join('');

                for (let i = 0; i < weather.days.length; i++) {
                    const d = weather.days[i];
                    const pick = document.querySelector(`#day-${i} .day-pick`);

                    try {
                        const weatherDocument = `Min Temp: ${d.minC}, Max Temp: ${d.maxC}, Weather: ${d.weatherText}`;
                        const genre = await recommendText({ kind: 'forecast_genre', weather: weatherDocument });
                        const track = await recommendItem({ kind: 'forecast_track', genre: genre });
                        const artist = await recommendText({ kind: 'forecast_artist', genre: genre });

                        pick.innerHTML =
                            row('Genre', escapeHtml(genre)) +
                            row('Track', escapeHtml(track.title) +
                                (track.artist ? ` <span class="artist">· ${escapeHtml(track.artist)}</span>` : '')) +
                            row('Artist', escapeHtml(artist));
                    } catch (err) {
                        pick.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
                    }
                }

            } catch (error) {
                displayError(`Error fetching data: ${error.message}`);
            }
        }

        // --- Rendering -----------------------------------------------------

        function row(key, valueHtml) {
            return `<div class="day-pick-row"><span class="k">${escapeHtml(key)}</span><span class="v">${valueHtml}</span></div>`;
        }

        // Dates arrive as YYYY-MM-DD. Parsing that bare string is treated as
        // UTC, which can land on the previous day in western timezones, so pin
        // it to local midnight.
        function formatDate(iso) {
            const d = new Date(iso + 'T00:00:00');
            return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function displayLocation(weather, city_text) {
            const label = decodeURIComponent(city_text);
            const city = label.split(',')[0];
            const rest = label.split(',').slice(1).join(',').trim();

            document.getElementById('location').innerHTML =
                `<span class="card-label">Location</span>` +
                `<p class="city">${escapeHtml(city)}</p>` +
                (rest ? `<p class="meta">${escapeHtml(rest)}</p>` : '');
        }

        function displayError(message) {
            document.getElementById('status').innerHTML = `<p class="error">${escapeHtml(message)}</p>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // --- API -----------------------------------------------------------

        async function fetchWeatherData(locationKey) {
            const weatherResponse = await fetch(`/api/weather?kind=forecast&key=${encodeURIComponent(locationKey)}`);
            const weatherData = await weatherResponse.json().catch(() => null);
            if (!weatherResponse.ok) throw new Error(weatherData?.error || `Weather API error: ${weatherResponse.status}`);
            if (!weatherData || !weatherData.days) throw new Error('Invalid weather data');
            return weatherData;
        }

        async function recommend(payload) {
            const response = await fetch('/api/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => null);
            if (!response.ok) throw new Error(data?.error || `Recommendation error: ${response.status}`);
            if (!data) throw new Error('Invalid response structure');

            return data;
        }

        async function recommendText(payload) {
            const data = await recommend(payload);
            if (!data.text) throw new Error('Invalid response structure');
            return data.text.trim();
        }

        async function recommendItem(payload) {
            const data = await recommend(payload);
            if (!data.item || !data.item.title) throw new Error('Invalid response structure');
            return data.item;
        }

        window.onload = getWeather;
    </script>
</body>
</html>
