<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Taste — Yesterday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="theme-past">
    <div id="content-wrapper">
        <div id="main-content">
            <div id="weather">
                <span class="card-label">Yesterday</span>
                <p class="is-loading">Loading weather</p>
            </div>

            <div id="music-genre">
                <span class="card-label">Matched genre</span>
                <p class="is-loading">Listening back</p>
            </div>

            <div id="recommended-tracks">
                <span class="card-label">Tracks for yesterday</span>
                <p class="is-loading">Picking tracks</p>
            </div>
        </div>

        <div id="sidebar-content">
            <div id="location">
                <span class="card-label">Location</span>
                <p class="is-loading">Locating</p>
            </div>
            <div class="nav-button">
                <a href="javascript:void(0);" id="backButton" class="forecast-button">← Back to now</a>
            </div>
            <div class="nav-button">
                <a href="intel.html" class="back-button">← Change city</a>
            </div>
        </div>

        <div id="artists">
            <span class="card-label">Artists to explore</span>
            <p class="is-loading">Finding artists</p>
        </div>
    </div>

    <script>
        // Weather and recommendations go through this site's own /api routes.
        // The WeatherAPI and Groq keys are Cloudflare secrets held on the
        // server and are never sent to the browser.

        async function getHistoricalWeather() {
            const params = new URLSearchParams(window.location.search);
            const locationKey = params.get('city');
            const city_text = params.get('city_text');

            if (!locationKey || !city_text) {
                displayError('weather', 'Missing location key or city name.');
                return;
            }

            try {
                const historicalWeather = await fetchHistoricalWeatherData(locationKey);

                displayLocation(historicalWeather, city_text);

                const weatherDocument = `City: ${historicalWeather.city}, Temperature: ${historicalWeather.temperatureC}°C, Weather: ${historicalWeather.weatherText}`;

                const musicGenre = await recommendText({ kind: 'genre', weather: weatherDocument });
                setCard('music-genre', 'Matched genre', `<p class="genre">${escapeHtml(musicGenre)}</p>`);

                const tracks = await recommendItems({ kind: 'tracks', genre: musicGenre });
                setCard('recommended-tracks', 'Tracks for yesterday', trackList(tracks));

                const artists = await recommendItems({ kind: 'artists', genre: musicGenre });
                setCard('artists', 'Artists to explore', artistList(artists));

                document.getElementById('backButton').href = `n_t.html?city=${encodeURIComponent(locationKey)}&city_text=${encodeURIComponent(city_text)}`;

            } catch (error) {
                displayError('weather', `Error fetching data: ${error.message}`);
            }
        }

        // --- Rendering -----------------------------------------------------

        function setCard(id, label, html) {
            document.getElementById(id).innerHTML =
                `<span class="card-label">${escapeHtml(label)}</span>${html}`;
        }

        function trackList(items) {
            return '<ol class="rec-list">' + items.map(function (t) {
                const artist = t.artist ? `<span class="rec-artist">${escapeHtml(t.artist)}</span>` : '';
                return `<li><span class="rec-title">${escapeHtml(t.title)}</span>${artist}</li>`;
            }).join('') + '</ol>';
        }

        function artistList(items) {
            return '<ol class="rec-list">' + items.map(function (a) {
                return `<li><span class="rec-title">${escapeHtml(a.name)}</span></li>`;
            }).join('') + '</ol>';
        }

        function displayLocation(weather, city_text) {
            const label = decodeURIComponent(city_text);
            const city = label.split(',')[0];
            const rest = label.split(',').slice(1).join(',').trim();

            setCard('location', 'Location',
                `<p class="city">${escapeHtml(city)}</p>` +
                (rest ? `<p class="meta">${escapeHtml(rest)}</p>` : ''));

            const dated = weather.date ? `<span class="temp">${escapeHtml(weather.temperatureC)}°C · ${escapeHtml(weather.date)}</span>`
                                       : `<span class="temp">${escapeHtml(weather.temperatureC)}°C</span>`;
            setCard('weather', 'Yesterday',
                `<p class="headline">${escapeHtml(weather.weatherText)}${dated}</p>`);
        }

        function displayError(elementId, message) {
            document.getElementById(elementId).innerHTML = `<p class="error">${escapeHtml(message)}</p>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // --- API -----------------------------------------------------------

        async function fetchHistoricalWeatherData(locationKey) {
            const weatherResponse = await fetch(`/api/weather?kind=historical&key=${encodeURIComponent(locationKey)}`);
            const weatherData = await weatherResponse.json().catch(() => null);
            if (!weatherResponse.ok) throw new Error(weatherData?.error || `Weather API error: ${weatherResponse.status}`);
            if (!weatherData || weatherData.temperatureC === null) throw new Error('Invalid weather data');

            return weatherData;
        }

        async function recommend(payload) {
            const response = await fetch('/api/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => null);
            if (!response.ok) throw new Error(data?.error || `Recommendation error: ${response.status}`);
            if (!data) throw new Error('Invalid response structure');

            return data;
        }

        async function recommendText(payload) {
            const data = await recommend(payload);
            if (!data.text) throw new Error('Invalid response structure');
            return data.text.trim();
        }

        async function recommendItems(payload) {
            const data = await recommend(payload);
            if (!Array.isArray(data.items) || !data.items.length) throw new Error('Invalid response structure');
            return data.items;
        }

        window.onload = getHistoricalWeather;
    </script>
</body>
</html>
